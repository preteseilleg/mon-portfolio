name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint HTML
        run: npx --yes htmlhint "**/*.html"

      - name: Check JS syntax
        run: node --check js/main.js

      - name: Validate JSON data
        run: node -e "JSON.parse(require('fs').readFileSync('data/projects.json', 'utf8'))"
